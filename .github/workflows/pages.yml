name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run the demo script against the offline parser
        run: npm test
      - name: Build the static site
        env:
          GITHUB_PAGES: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          # GitHub Pages is static, so the /api/parse route can't be exported.
          # On this build notes are parsed by the offline rules in the browser.
          rm -rf app/api
          npx next build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
